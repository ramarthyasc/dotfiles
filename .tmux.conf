# For tmux performance in Neovim
set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'xterm-256color:RGB'

set-option -g prefix 'C-space'
bind-key h run-shell "bash ~/.scripts/tmux-script.sh 'h'"
bind-key j run-shell "bash ~/.scripts/tmux-script.sh 'j'"
bind-key k run-shell "bash ~/.scripts/tmux-script.sh 'k'"
bind-key l run-shell "bash ~/.scripts/tmux-script.sh 'l'"

set -g status-bg "#93E9BE"
set -g status-fg "#654735"

bind-key r run-shell "tmux source-file ~/.tmux.conf"
setw -g mode-keys vi

# Copy from tmux to the system clipboard.
# Keep set-clipboard off when using an OS clipboard command.
set -s set-clipboard off

# Start selection with v; copy the selection with y.
bind -T copy-mode-vi v send-keys -X begin-selection

# macOS
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Linux — Wayland (uncomment this and comment out the macOS binding)
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Linux — X11 (use this instead of wl-copy if you're on X11)
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Show relative line numbers in tmux copy mode
setw -g copy-mode-line-numbers relative

# Style the line numbers
setw -g copy-mode-line-number-style "fg=red,dim"
setw -g copy-mode-current-line-number-style "fg=yellow,bold"
